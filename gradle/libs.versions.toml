syncengine-client = { module = "me.dvyy.syncengine:client", version.ref = "syncengine" }
syncengine-server = { module = "me.dvyy.syncengine:server", version.ref = "syncengine" }
syncengine-json-actions = { module = "me.dvyy.syncengine:json-actions", version.ref = "syncengine" }
emoji-compose = "org.kodein.emoji:emoji-kt:2.0.1"
emoji-compose-m3 = "org.kodein.emoji:emoji-compose-m3:2.0.1"

[plugins]
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
