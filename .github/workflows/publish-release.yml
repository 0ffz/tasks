name: Publish app release

on:
  push:
    branches:
      - master
      - develop
    paths-ignore:
      - '**.md'
      - 'app-server/**'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: adopt
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Keystore
        id: decode_keystore
        uses: timheuer/base64-to-file@v1
        with:
          fileName: 'keystore/your_signing_keystore.jks'
          encodedString: ${{ secrets.KEYSTORE }}

      - name: Run gradle build
        run: >
          ./gradlew :app-android:assembleRelease
          -PandroidKeystoreFile=${{ steps.decode_keystore.outputs.filePath }}
          -PandroidKeystorePassword=${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: build-android
          path: 'app-android/build/outputs/apk/release/*.apk'
  build-desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'liberica'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install FUSE (ubuntu)
        run: sudo apt-get install libfuse2 fuse binutils
        if: ${{ matrix.os == 'ubuntu-latest' }}

      - name: Run custom gradle package
        run: ./gradlew :targets:desktop:packageForRelease --no-configuration-cache
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: 'targets/desktop/releases/*'

      - name: Stop gradle daemon for Windows cache
        run: ./gradlew --stop
        if: ${{ matrix.os == 'windows-latest' }}
  publish-release:
    needs: [ build-desktop, build-android ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Move all release artifacts into one folder
        shell: bash
        run: |
          mkdir releases
          mv artifacts/build*/* releases

      - name: Get version from properties file
        shell: bash
        run: |
          echo "RELEASE_VERSION"=$(grep -w "version" < gradle.properties | cut -d'=' -f2) >> $GITHUB_ENV

      - name: 📦️ Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          target_commitish: ${{ github.sha }}
          # body: ${{ steps.git-cliff.outputs.content }}
          prerelease: ${{ github.ref == format('refs/heads/{0}', 'develop') }}
          tag_name: v${{ env.RELEASE_VERSION }}
          files: releases/*
